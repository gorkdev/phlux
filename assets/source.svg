<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d83ff"/>
      <stop offset="1" stop-color="#4a37c4"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Top glass highlight -->
  <path d="M 0 224 Q 0 0 224 0 L 800 0 Q 1024 0 1024 224 L 1024 410
           Q 780 250 512 250 Q 244 250 0 410 Z"
        fill="url(#highlight)"/>

  <!-- PHP (hero) -->
  <text x="512" y="580"
        text-anchor="middle"
        font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
        font-weight="900"
        font-size="420"
        letter-spacing="-14"
        fill="#ffffff">PHP</text>

  <!-- Thin divider -->
  <rect x="352" y="650" width="320" height="6" rx="3"
        fill="#ffffff" fill-opacity="0.35"/>

  <!-- VERSION -->
  <text x="512" y="810"
        text-anchor="middle"
        font-family="'Segoe UI', 'Inter', Arial, sans-serif"
        font-weight="700"
        font-size="130"
        letter-spacing="22"
        fill="#ffffff"
        fill-opacity="0.95">VERSION</text>
</svg>
